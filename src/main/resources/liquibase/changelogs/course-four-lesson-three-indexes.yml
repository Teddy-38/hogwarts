databaseChangeLog:
  - changeSet:
      id: 1-create-student-name-index
      author: Teddy_38
      changes:
        - createIndex:
            tableName: student
            indexName: idx_student_name
            columns:
              - column:
                  name: name

  - changeSet:
      id: 2-create-faculty-name-color-index
      author: Teddy_38
      changes:
        - createIndex:
            tableName: faculty
            indexName: idx_faculty_name_color
            columns:
              - column:
                  name: name
              - column:
                  name: color